name: Build and test CUDA package
description: Build an sdist and CUDA wheel in a pinned PyTorch development image
inputs:
  image:
    description: CUDA development container image
    required: true
  torch-version:
    description: Expected PyTorch version
    required: true
  cuda-version:
    description: Expected CUDA toolkit version
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CUDA_BUILD_IMAGE: ${{ inputs.image }}
        EXPECTED_TORCH: ${{ inputs.torch-version }}
        EXPECTED_CUDA: ${{ inputs.cuda-version }}
        FORCE_CUDA: '1'
        FORCE_OPENMP: '1'
        TORCH_CUDA_ARCH_LIST: '8.0'
        MAX_JOBS: '2'
      run: |
        docker run --rm -i \
          --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
          --env EXPECTED_TORCH --env EXPECTED_CUDA --env FORCE_CUDA --env FORCE_OPENMP \
          --env TORCH_CUDA_ARCH_LIST --env MAX_JOBS \
          "$CUDA_BUILD_IMAGE" bash -euo pipefail <<'BASH'
        # Newer images mark system Python externally managed. This container
        # is disposable and intentionally installs the wheel into that Python.
        export PIP_BREAK_SYSTEM_PACKAGES=1
        nvcc --version
        python -c 'import os, torch; assert torch.__version__.split("+")[0] == os.environ["EXPECTED_TORCH"]; assert torch.version.cuda == os.environ["EXPECTED_CUDA"]; assert not torch.cuda.is_available()'
        python -m pip install --no-cache-dir numpy 'pytest>=8,<10' 'setuptools>=77' 'packaging>=24.2' wheel ninja build
        python -m build --sdist --no-isolation
        python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz -w dist
        python -m pip install --no-deps dist/*.whl
        cp -R tests /tmp/msda-tests
        cd /tmp
        python -c 'from torch_ms_deform_attn import _C; assert _C.with_cuda; assert _C.cpu_parallel_backend == "openmp", _C.cpu_parallel_backend'
        python -m pytest msda-tests -v
        BASH
