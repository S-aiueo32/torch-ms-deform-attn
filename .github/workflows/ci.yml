name: CPU package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.5.1 numpy setuptools wheel ninja build
      - run: python -m build --sdist --no-isolation
      - run: python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz -w dist
      - run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside checkout
        run: |
          cp -R tests "$RUNNER_TEMP/msda-tests"
          cd "$RUNNER_TEMP"
          python -m unittest discover -s msda-tests -v
