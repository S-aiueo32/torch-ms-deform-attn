name: CPU package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', torch: '2.5.0', openmp: '0', backend: serial}
          - {os: ubuntu-latest, python: '3.11', torch: '2.5.1', openmp: '1', backend: openmp}
          - {os: ubuntu-latest, python: '3.12', torch: '2.7.1', openmp: '1', backend: openmp}
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / torch ${{ matrix.torch }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      FORCE_CPU: "1"
      FORCE_OPENMP: ${{ matrix.openmp }}
      EXPECTED_CPU_BACKEND: ${{ matrix.backend }}
      MAX_JOBS: "2"
      TORCH_VERSION: ${{ matrix.torch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux CPU PyTorch
        run: python -m pip install "torch==$TORCH_VERSION" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy 'setuptools>=77' 'packaging>=24.2' wheel ninja build
      - run: python -m build --sdist --no-isolation
      - run: python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz -w dist
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s build_tests -v
      - name: Test installed wheel outside checkout
        run: |
          cp -R tests "$RUNNER_TEMP/msda-tests"
          cd "$RUNNER_TEMP"
          python -c 'import os; from torch_ms_deform_attn import _C; assert not _C.with_cuda; assert _C.cpu_parallel_backend == os.environ["EXPECTED_CPU_BACKEND"], _C.cpu_parallel_backend'
          python -m unittest discover -s msda-tests -v
      - name: Record matrix result
        if: always()
        env:
          RESULT: ${{ job.status }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: echo "$GITHUB_SHA | $RUNNER_OS | Python $PYTHON_VERSION | torch $TORCH_VERSION | $EXPECTED_CPU_BACKEND | $RESULT" >> "$GITHUB_STEP_SUMMARY"
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_CPU: '1'
      FORCE_OPENMP: '1'
      MAX_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy 'setuptools>=77' 'packaging>=24.2' wheel ninja
      - name: Rebuild the same checkout after upgrading PyTorch
        run: |
          for version in 2.5.0 2.7.1; do
            python -m pip install "torch==$version" --index-url https://download.pytorch.org/whl/cpu
            python setup.py build_ext --inplace --force
            PYTHONPATH=src python -m unittest discover -s tests -v
          done
      - name: Rebuild after backend and Ninja changes
        run: |
          unset FORCE_OPENMP
          USE_NINJA=1 python setup.py build_ext --inplace
          PYTHONPATH=src python -c 'from torch_ms_deform_attn import _C; assert _C.cpu_parallel_backend == "openmp"'
          FORCE_OPENMP=0 USE_NINJA=0 python setup.py build_ext --inplace
          PYTHONPATH=src python -c 'from torch_ms_deform_attn import _C; assert _C.cpu_parallel_backend == "serial"'
          OMP_PREFIX=/nonexistent USE_NINJA=0 python setup.py build_ext --inplace
          PYTHONPATH=src python -m unittest discover -s tests -p test_cpu.py -v
          PYTHONPATH=src python -c 'from torch_ms_deform_attn import _C; assert _C.cpu_parallel_backend == "serial"'
          FORCE_OPENMP=1 USE_NINJA=1 python setup.py build_ext --inplace
          PYTHONPATH=src python -m unittest discover -s tests -p test_cpu.py -v
          PYTHONPATH=src python -c 'from torch_ms_deform_attn import _C; assert _C.cpu_parallel_backend == "openmp"'
