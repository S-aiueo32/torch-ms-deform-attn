name: CUDA package build
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Build all CUDA pairs instead of only the minimum and latest
        type: boolean
        default: false
  workflow_call:
    inputs:
      full_matrix:
        description: Build all CUDA pairs instead of only the minimum and latest
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cuda-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix:
    name: Select build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configurations: ${{ steps.configurations.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: configurations
        env:
          FULL_MATRIX: ${{ inputs.full_matrix }}
        run: |
          arguments=()
          if [ "$FULL_MATRIX" = true ]; then
            arguments+=(--full)
          fi
          echo "value=$(python3 scripts/cuda_matrix.py "${arguments[@]}")" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.configurations) }}
    name: torch ${{ matrix.torch }} / CUDA ${{ matrix.cuda }} build only
    # Compile CUDA and exercise its host-side checks without requiring a GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reclaim unused host tool cache for the CUDA development image
        # Python and the CUDA toolkit come from the container in this job.
        run: |
          test "$RUNNER_TOOL_CACHE" = /opt/hostedtoolcache
          sudo rm -rf "$RUNNER_TOOL_CACHE"
          df -h /
      - name: Build source distribution and test the installed CUDA wheel
        uses: ./.github/actions/cuda-package-build
        with:
          image: ${{ matrix.image }}
          torch-version: ${{ matrix.torch }}
          cuda-version: ${{ matrix.cuda }}
      - name: Upload CUDA distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuda-build-torch-${{ matrix.torch }}-cu${{ matrix.cuda }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: ignore
          retention-days: 14
