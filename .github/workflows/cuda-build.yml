name: CUDA package build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch: '2.4.0'
            cuda: '12.4'
            image: pytorch/pytorch:2.4.0-cuda12.4-cudnn9-devel@sha256:e96c6896ecfbb50d89c87bf94110206ef444f27268c5f72201eb29fba9c90331
          - torch: '2.5.1'
            cuda: '12.4'
            image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-devel@sha256:14611869895df612b7b07227d5925f30ec3cd6673bad58ce3d84ed107950e014
          - torch: '2.7.1'
            cuda: '12.6'
            image: pytorch/pytorch:2.7.1-cuda12.6-cudnn9-devel
          - torch: '2.8.0'
            cuda: '12.6'
            image: pytorch/pytorch:2.8.0-cuda12.6-cudnn9-devel@sha256:adb0f2d3769e0796a5d86740b0f900a72835b6fa9577b77d6efed460f1322fcb
          - torch: '2.14.0'
            cuda: '12.6'
            image: pytorch/pytorch:2.14.0-cuda12.6-cudnn9-devel@sha256:0e968d2570373aeb781603c21925a030053b432945967da14f6f8423e1f0cc79
    name: torch ${{ matrix.torch }} / CUDA ${{ matrix.cuda }} build only
    # Compile CUDA and exercise its host-side checks without requiring a GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_BUILD_IMAGE: ${{ matrix.image }}
      EXPECTED_TORCH: ${{ matrix.torch }}
      EXPECTED_CUDA: ${{ matrix.cuda }}
      FORCE_CUDA: "1"
      FORCE_OPENMP: "1"
      TORCH_CUDA_ARCH_LIST: "8.0"
      MAX_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused host tool cache for the CUDA development image
        # Python and the CUDA toolkit come from the container in this job.
        run: |
          test "$RUNNER_TOOL_CACHE" = /opt/hostedtoolcache
          sudo rm -rf "$RUNNER_TOOL_CACHE"
          df -h /
      - name: Build source distribution and test the installed CUDA wheel
        run: |
          docker run --rm -i \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env EXPECTED_TORCH --env EXPECTED_CUDA --env FORCE_CUDA --env FORCE_OPENMP --env TORCH_CUDA_ARCH_LIST --env MAX_JOBS \
            "$CUDA_BUILD_IMAGE" bash -euo pipefail <<'BASH'
          # Newer images mark system Python externally managed. This container
          # is disposable and intentionally installs the wheel into that Python.
          export PIP_BREAK_SYSTEM_PACKAGES=1
          nvcc --version
          python -c 'import os, torch; assert torch.__version__.split("+")[0] == os.environ["EXPECTED_TORCH"]; assert torch.version.cuda == os.environ["EXPECTED_CUDA"]; assert not torch.cuda.is_available()'
          python -m pip install --no-cache-dir numpy 'setuptools>=77' 'packaging>=24.2' wheel ninja build
          python -m build --sdist --no-isolation
          python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz -w dist
          python -m pip install --no-deps dist/*.whl
          cp -R tests /tmp/msda-tests
          cd /tmp
          python -c 'from torch_ms_deform_attn import _C; assert _C.with_cuda; assert _C.cpu_parallel_backend == "openmp", _C.cpu_parallel_backend'
          python -m unittest discover -s msda-tests -v
          BASH
