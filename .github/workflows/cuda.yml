name: CUDA correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    # Register a GPU runner with these labels before dispatching this workflow.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    env:
      FORCE_CUDA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/torch-deform-attn-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "$RUNNER_TEMP/torch-deform-attn-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/bin" >> "$GITHUB_PATH"
      - run: python -m pip install torch==2.5.1 numpy setuptools wheel ninja build
      - name: Check GPU and toolkit
        run: |
          nvcc --version
          python -c 'import torch; assert torch.cuda.is_available(); print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name())'
      - run: python -m build --sdist --no-isolation
      - run: python -m pip wheel --no-build-isolation --no-deps dist/*.tar.gz -w dist
      - run: python -m pip install --no-deps dist/*.whl
      - name: Test installed CUDA wheel
        run: |
          cp -R tests "$RUNNER_TEMP/msda-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP"
          python -c 'from torch_deform_attn import _C; assert _C.with_cuda'
          python -m unittest discover -s "msda-tests-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -v
