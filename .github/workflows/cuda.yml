name: CUDA GPU
on:
  workflow_dispatch:
    inputs:
      task:
        description: Check access, validate core CUDA, benchmark it, or test Kernel Hub
        type: choice
        default: core
        options: [check, core, benchmark, kernel-hub]
      kernel_hub_suite:
        description: Kernel Hub only — full matrix, focused checks, or Phase 3 benchmark
        type: choice
        default: full
        options: [full, nix-full, compile-amp, phase1, benchmark]
      nix_build_run:
        description: Nix build run ID (required for nix-full)
        type: string
      nix_archive_release:
        description: Optional release tag containing kernel-hub-nix-RUN_ID.zip
        type: string
      torch_version:
        description: PyTorch version (2.4/2.5 use CUDA 12.4; newer versions use CUDA 12.6)
        type: choice
        default: '2.5.1'
        options: ['2.4.0', '2.5.1', '2.7.1', '2.8.0', '2.14.0']
      sanitizer:
        description: Core CUDA only — optional memory/synchronization check
        type: choice
        default: none
        options: [none, memcheck, racecheck, synccheck, initcheck, all]
      gpu:
        description: Rent one Secure Cloud GPU (no automatic model substitution)
        type: choice
        default: NVIDIA L4
        options: [NVIDIA RTX A5000, NVIDIA L4, NVIDIA GeForce RTX 4090]
      max_hourly_usd:
        description: Maximum accepted compute price in USD/hour (checked before and after creation)
        type: string
        default: '0.50'
      timeout_minutes:
        description: Maximum controller execution time in minutes (5-60)
        type: number
        default: 45
      capacity_wait_minutes:
        description: Wait for the selected GPU without renting a Pod (within total timeout)
        type: number
        default: 0
permissions:
  contents: read
  actions: read
concurrency:
  group: runpod-cuda
  cancel-in-progress: false
jobs:
  nix-archive:
    if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite == 'nix-full' && inputs.nix_archive_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub requires push access to read draft releases. This job never checks
    # out or runs repository code; the GPU/controller job keeps read access.
    permissions:
      contents: write
    steps:
      - name: Download archived Nix artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIX_BUILD_RUN: ${{ inputs.nix_build_run }}
          NIX_ARCHIVE_RELEASE: ${{ inputs.nix_archive_release }}
        run: |
          [[ "$NIX_BUILD_RUN" =~ ^[1-9][0-9]*$ ]] || { echo 'A numeric nix_build_run is required'; exit 1; }
          gh release download "$NIX_ARCHIVE_RELEASE" \
            --pattern "kernel-hub-nix-$NIX_BUILD_RUN.zip" --dir "$RUNNER_TEMP/nix-archive"
      - uses: actions/upload-artifact@v4
        with:
          name: selected-nix-archive
          path: ${{ runner.temp }}/nix-archive/*.zip
          if-no-files-found: error
          retention-days: 1
  runpod:
    needs: nix-archive
    if: always() && !cancelled() && (needs.nix-archive.result == 'success' || needs.nix-archive.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: builder-cache
        if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite != 'nix-full'
        with:
          path: ~/.cargo/bin/kernel-builder
          key: kernel-builder-0.16.1-ubuntu-x86_64
      - name: Prepare Kernel Hub build
        if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite != 'nix-full'
        env:
          KERNEL_HUB_SUITE: ${{ inputs.kernel_hub_suite }}
        run: |
          if ! command -v kernel-builder; then
            rustup toolchain install 1.94.0 --profile minimal
            cargo +1.94.0 install hf-kernel-builder --version 0.16.1 --locked
          fi
          python3 kernel-hub/export.py "$RUNNER_TEMP/kernel-hub-preflight" --revision "$GITHUB_SHA"
          kernel-builder create-pyproject "$RUNNER_TEMP/kernel-hub-preflight" --unique-id "$GITHUB_SHA"
          if [ "$KERNEL_HUB_SUITE" = benchmark ]; then
            python3 kernel-hub/benchmarks/competitors.py "$RUNNER_TEMP/kernel-hub-preflight/benchmark-sources"
          fi
      - uses: actions/cache/save@v4
        if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite != 'nix-full' && steps.builder-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/kernel-builder
          key: kernel-builder-0.16.1-ubuntu-x86_64
      - uses: actions/download-artifact@v4
        if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite == 'nix-full' && inputs.nix_archive_release != ''
        with:
          name: selected-nix-archive
          path: ${{ runner.temp }}/nix-archive
      - name: Prepare reviewed Nix distribution
        if: inputs.task == 'kernel-hub' && inputs.kernel_hub_suite == 'nix-full'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NIX_BUILD_RUN: ${{ inputs.nix_build_run }}
          NIX_ARCHIVE_RELEASE: ${{ inputs.nix_archive_release }}
        run: |
          download_args=(--download)
          if [ -n "$NIX_ARCHIVE_RELEASE" ]; then
            python3 -m zipfile -e "$RUNNER_TEMP/nix-archive/kernel-hub-nix-$NIX_BUILD_RUN.zip" "$RUNNER_TEMP/nix-artifact"
            download_args=()
          fi
          python3 scripts/prepare_kernel_hub_nix.py \
            "$RUNNER_TEMP/nix-artifact" "$RUNNER_TEMP/kernel-hub-preflight" \
            --revision "$GITHUB_SHA" --build-run "$NIX_BUILD_RUN" \
            "${download_args[@]}"
      - name: Run CUDA task on Runpod
        uses: ./.github/actions/runpod-cuda
        with:
          task: ${{ inputs.task }}
          kernel-hub-suite: ${{ inputs.kernel_hub_suite }}
          torch-version: ${{ inputs.torch_version }}
          sanitizer: ${{ inputs.sanitizer }}
          gpu: ${{ inputs.gpu }}
          max-hourly-usd: ${{ inputs.max_hourly_usd }}
          timeout-minutes: ${{ inputs.timeout_minutes }}
          capacity-wait-minutes: ${{ inputs.capacity_wait_minutes }}
          api-key: ${{ secrets.RUNPOD_API_KEY }}
      - name: Upload CUDA results, logs, and wheel
        if: always() && inputs.task != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: cuda-runpod-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runpod-results/
          if-no-files-found: ignore
          retention-days: ${{ inputs.task == 'benchmark' && 7 || 90 }}
      - name: Record revision and GPU evidence location
        if: always() && inputs.task != 'check'
        env:
          TASK: ${{ inputs.task }}
        run: |
          {
            echo "Source SHA: $GITHUB_SHA"
            echo "Task: $TASK"
            echo "GPU results: cuda-runpod-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if [ "$TASK" = core ]; then
              echo "Review cuda-tests.json, cuda-completion.json and cuda-checks.log; archive with the release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
