name: CUDA GPU
on:
  workflow_dispatch:
    inputs:
      task:
        description: Check access, validate core CUDA, benchmark it, or test Kernel Hub
        type: choice
        default: core
        options: [check, core, benchmark, kernel-hub]
      kernel_hub_suite:
        description: Kernel Hub only — full matrix, focused checks, or Phase 3 benchmark
        type: choice
        default: full
        options: [full, nix-full, compile-amp, phase1, benchmark]
      torch_version:
        description: PyTorch version (2.4/2.5 use CUDA 12.4; newer versions use CUDA 12.6)
        type: choice
        default: '2.5.1'
        options: ['2.4.0', '2.5.1', '2.7.1', '2.8.0', '2.14.0']
      sanitizer:
        description: Core CUDA only — optional memory/synchronization check
        type: choice
        default: none
        options: [none, memcheck, racecheck, synccheck, initcheck, all]
      gpu:
        description: Rent one Secure Cloud GPU (no automatic model substitution)
        type: choice
        default: NVIDIA L4
        options: [NVIDIA RTX A5000, NVIDIA L4, NVIDIA GeForce RTX 4090]
      max_hourly_usd:
        description: Maximum accepted compute price in USD/hour (checked before and after creation)
        type: string
        default: '0.50'
      timeout_minutes:
        description: Maximum controller execution time in minutes (5-60)
        type: number
        default: 45
      capacity_wait_minutes:
        description: Wait for the selected GPU without renting a Pod (within total timeout)
        type: number
        default: 0
permissions:
  contents: read
  actions: read
jobs:
  run:
    uses: ./.github/workflows/reusable-cuda-gpu.yml
    with:
      task: ${{ inputs.task }}
      kernel_hub_suite: ${{ inputs.kernel_hub_suite }}
      torch_version: ${{ inputs.torch_version }}
      sanitizer: ${{ inputs.sanitizer }}
      gpu: ${{ inputs.gpu }}
      max_hourly_usd: ${{ inputs.max_hourly_usd }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      capacity_wait_minutes: ${{ inputs.capacity_wait_minutes }}
    secrets:
      runpod_api_key: ${{ secrets.RUNPOD_API_KEY }}
