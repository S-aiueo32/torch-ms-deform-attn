name: Publish to PyPI / TestPyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Build only or publish to TestPyPI
        type: choice
        default: build-only
        options:
          - build-only
          - testpypi

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_CPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}')
          PY
      - name: Verify release GPU evidence
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-evidence" \
            --pattern cuda-tests.json --pattern cuda-completion.json \
            --pattern cuda-checks.log --pattern nvidia-smi.txt
          python scripts/verify_cuda_release.py \
            --sha "$(git rev-parse HEAD)" --evidence "$RUNNER_TEMP/release-evidence"
          test -s "$RUNNER_TEMP/release-evidence/nvidia-smi.txt"
      - name: Install source build dependencies
        # setup.py imports torch even for sdist; the project disables build isolation.
        run: |
          uv pip install --system 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system 'setuptools>=77' 'packaging>=24.2' wheel
      - name: Pin PyPI README links to the source commit
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/prepare_pypi_readme.py \
            --repository "$SOURCE_REPOSITORY" --revision "$(git rev-parse HEAD)"
      - name: Build source distribution
        run: uv build --sdist --no-sources --no-build-isolation --out-dir dist/pypi
      - name: Validate distribution without uploading
        run: uv publish --dry-run dist/pypi/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-sdist
          path: dist/pypi/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/torch-ms-deform-attn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-sdist
          path: dist
      - name: Publish source distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/torch-ms-deform-attn/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-sdist
          path: dist
      - name: Publish source distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
