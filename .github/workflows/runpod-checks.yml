name: Runpod controller checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/cuda.yml'
      - '.github/workflows/cuda-benchmark.yml'
      - 'benchmarks/benchmark_cuda.py'
      - '.github/workflows/runpod-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runpod-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'pytest>=8,<10'
      - name: Test price checks and Pod lifecycle failures without renting a GPU
        run: python3 -m pytest scripts/tests -v
      - name: Check shell syntax
        run: bash -n scripts/runpod_bootstrap.sh scripts/run_cuda_checks.sh scripts/test_runpod_bootstrap.sh
      - name: Verify temporary SSH credentials in a CPU container
        run: bash scripts/test_runpod_bootstrap.sh
