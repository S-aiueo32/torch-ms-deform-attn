name: Runpod controller checks
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/actions/cuda-package-build/**'
      - '.github/actions/runpod-cuda/**'
      - '.github/workflows/cuda.yml'
      - '.github/workflows/cuda-build.yml'
      - 'benchmarks/benchmark_cuda.py'
      - '.github/workflows/runpod-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runpod-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.5'
      - name: Test price checks and Pod lifecycle failures without renting a GPU
        run: uv run --no-project --with 'pytest>=8,<10' --with certifi==2026.10.23 python -m pytest scripts/tests -v
      - name: Verify pinned Linux uv bootstrap
        run: |
          python3 scripts/bootstrap_uv.py "$RUNNER_TEMP/verified-uv"
          "$RUNNER_TEMP/verified-uv/uv" --version
      - name: Verify the shared CUDA build matrix
        run: |
          python3 scripts/cuda_matrix.py
          python3 scripts/cuda_matrix.py --full
      - name: Check shell syntax
        run: bash -n scripts/runpod_bootstrap.sh scripts/run_cuda_checks.sh scripts/test_runpod_bootstrap.sh
      - name: Verify temporary SSH credentials in a CPU container
        run: bash scripts/test_runpod_bootstrap.sh
