name: Runpod cleanup
on:
  workflow_run:
    workflows: [CUDA correctness]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runpod-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    # Enable after adding RUNPOD_API_KEY and merging this file into main.
    if: vars.RUNPOD_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINISHED_RUN_ID: ${{ github.event.workflow_run.id }}
      FINISHED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
    steps:
      # Use the default branch's controller, never code/artifacts from the run
      # that triggered this privileged recovery workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete Pods belonging to the completed run
        if: github.event_name == 'workflow_run'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 scripts/runpod_ci.py cleanup \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$FINISHED_RUN_ID" --attempt "$FINISHED_ATTEMPT" \
            --state-dir "$RUNNER_TEMP/runpod-recovery"
      - name: Delete this repository's Pods older than two hours
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          python3 scripts/runpod_ci.py reap \
            --repository "$GITHUB_REPOSITORY" --repository-id "$GITHUB_REPOSITORY_ID"
